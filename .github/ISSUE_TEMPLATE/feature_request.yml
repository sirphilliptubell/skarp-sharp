name: Feature request
description: Suggest a new check, option or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The maintainer may decline features that do not fit the roadmap. Describing the problem first helps.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Skarp to do? Include example commands or output if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other tools or workarounds you tried.
    validations:
      required: false
  - type: textarea
    id: sources
    attributes:
      label: References
      description: Papers, articles or other tools that describe the idea, if any.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
